<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="630" viewBox="0 0 1260 630"><rect width="1260" height="630" rx="24" fill="#f3f6ff"/><g font-family="Arial,sans-serif" fill="#20232b"><text x="70" y="94" font-size="23" fill="#235ee8">УЧЕБНЫЙ ПРИМЕР · РЕГЛАМЕНТ ВЫСТУПЛЕНИЯ</text><text x="70" y="180" font-size="50" font-weight="700">10 − 2 − 1 = 7 минут</text><text x="70" y="237" font-size="26">Весь регламент − вопросы − вступление и финал</text><path d="M70 280H1190" stroke="#d1daf2" stroke-width="2"/><text x="70" y="355" font-size="38">420 секунд ÷ ваш темп</text><text x="70" y="431" font-size="52" font-weight="700" fill="#235ee8">45–90 секунд → 4–9 слайдов</text><text x="70" y="500" font-size="24">Титульный и финальный — отдельно. Темп — пример, не норма.</text><text x="70" y="555" font-size="24">Проверьте диапазон репетицией с таймером.</text></g></svg>